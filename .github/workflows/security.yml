name: security

# Bundled FOSS security scan via catenahq/scanctl (profile full): detects the
# repo's ecosystems and runs the matching scanners -- gitleaks, osv-scanner,
# trivy fs+license, semgrep, zizmor, guarddog -- merges SARIF to code
# scanning, and emits a CycloneDX SBOM artifact.

on:
  pull_request:
  # Every pushed branch. Renovate and engine-bump branches always carry a pull
  # request, which tests each push to them.
  push:
    branches-ignore: ['renovate/**', 'engine-bump/**', 'scanctl/**']
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  security-events: write

# A newer push to the branch, or a newer commit of the pull request, cancels the
# run it supersedes; the weekly run is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanctl:
    # @main on purpose: first-party reusable workflow, auto-updating, gated
    # by the ruleset on catenahq/scanctl itself (zizmor's bundled policy
    # allows catenahq/* ref-pins; renovate-config stops Renovate re-pinning
    # it to a SHA, which froze callers at stale scanctl versions).
    uses: catenahq/scanctl/.github/workflows/github-reusable.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      profile: full
      runner: ubuntu-latest
