# apps/docs -- standalone CI workflow.
#
# Inactive in the monorepo (GitHub Actions only reads from the repo
# root .github/workflows/). Carried inside this folder so that
# `git subtree split --prefix=apps/docs` lifts a complete CI
# pipeline into the new repo.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    name: docs (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
