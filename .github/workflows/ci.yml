# catenahq/docs -- CI.
#
# catenahq/contracts is consumed via sibling read: package.json
# declares `"@catenahq/contracts": "file:../contracts"`, so the
# checkout step puts contracts at $GITHUB_WORKSPACE/contracts and the
# docs job at $GITHUB_WORKSPACE/docs. Local dev mirrors this layout.
# catenahq/contracts is public, so the checkout needs no token.
#
# A push to a branch keeps the absolute gate. A pull request is judged on what
# it introduces: the docs job and the duplication ratchet run through
# contracts' new-failures-only action, which passes when the base commit fails
# them too.

name: CI

on:
  # Every pushed branch. Renovate and engine-bump branches always carry a pull
  # request, which tests each push to them.
  push:
    branches-ignore: ['renovate/**', 'engine-bump/**', 'scanctl/**']
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: docs (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out docs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: docs
          persist-credentials: false
      - name: Check out sibling contracts
        uses: catenahq/contracts/.github/actions/checkout-sibling@main
        with:
          repository: catenahq/contracts
          path: contracts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      # Pinned in contracts/.vale-version, which check-prose.mjs also
      # reads and enforces: the grammars decide which comments are
      # visible, so a different version is a different gate.
      - name: Install vale
        run: |
          version="$(cat contracts/.vale-version)"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${version}/vale_${version}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" vale
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install, hygiene, versions, prose, typecheck and build
        # Install is part of the gate: an update may change the lock.
        # Unicode hygiene (no em dashes / smart quotes / decorative symbols),
        # repo rules (no tracked env file; .gitignore carries the env rule),
        # versions (the documentation names no product version), prose
        # (comments describe the code, not its history).
        uses: catenahq/contracts/.github/actions/new-failures-only@main
        with:
          working-directory: ${{ github.workspace }}/docs
          repo-path: ${{ github.workspace }}/docs
          run: |
            npm ci
            npm run check:unicode
            node ../contracts/scripts/check-repo-rules.mjs
            npm run check:versions
            npm run check:prose
            npm run check
            npm run build

  duplication:
    # Copy-paste ratchet: .jscpd.json carries the baseline threshold;
    # exceeding it fails. Lower the threshold as duplication is paid
    # down, never raise it to admit new copy-paste.
    name: Duplication (jscpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: jscpd (threshold in .jscpd.json)
        uses: catenahq/contracts/.github/actions/new-failures-only@main
        with:
          working-directory: ${{ github.workspace }}
          repo-path: ${{ github.workspace }}
          run: npx --yes jscpd@4 --silent
