# catenahq/docs -- deploy docs.catena.run to GitHub Pages.
#
# Static Astro + Starlight build (npm run build -> dist/) published to
# GitHub Pages. The custom domain docs.catena.run is set via public/CNAME
# (persisted on deploy). Runs on push to main (the protected deploy
# branch); dev is the active-edit branch and does not deploy.
#
# @catenahq/contracts is consumed via sibling read (file:../contracts);
# the build checks out catenahq/contracts alongside. contracts is
# public, so no token is needed.
#
# A first step looks for the push run of ci.yml on the same tree (waiting up to
# 30 minutes for one still going). Its site artifact is published as it is; a
# tree whose CI failed fails the job and is not published; with no run, or no
# site artifact on the run, the site is built here.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: no permissions by default; each job grants only what
# it needs (zizmor flags workflow-level pages/id-token write as broad).
permissions: {}

# Allow one concurrent deployment; never cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: The CI run of this tree
        id: tree
        uses: catenahq/contracts/.github/actions/same-tree@main
        with:
          name: ci
          workflow: .github/workflows/ci.yml
          siblings: catenahq/contracts
          source-events: push
          record: false
          wait-minutes: 30
      - name: The run that built the site
        id: source
        if: steps.tree.outputs.state == 'success'
        env:
          SOURCE: ${{ steps.tree.outputs.source }}
        run: echo "run-id=${SOURCE##*/}" >> "$GITHUB_OUTPUT"
      - name: Download the site CI built
        id: site
        if: steps.source.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: docs/dist
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Check out docs
        if: steps.site.outcome != 'success'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: docs
          persist-credentials: false
      - name: Check out sibling contracts
        if: steps.site.outcome != 'success'
        uses: catenahq/contracts/.github/actions/checkout-sibling@main
        with:
          repository: catenahq/contracts
          path: contracts
      - if: steps.site.outcome != 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
      - name: Install
        if: steps.site.outcome != 'success'
        working-directory: ./docs
        run: npm ci
      - name: Build
        if: steps.site.outcome != 'success'
        working-directory: ./docs
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
