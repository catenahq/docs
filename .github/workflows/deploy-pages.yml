# catenahq/docs -- deploy docs.catena.run to GitHub Pages.
#
# Static Astro + Starlight build (npm run build -> dist/) published to
# GitHub Pages. The custom domain docs.catena.run is set via public/CNAME
# (persisted on deploy). Runs on push to release (the protected deploy
# branch); a merge into main does not deploy.
#
# @catenahq/contracts is consumed via sibling read (file:../contracts);
# the build checks out catenahq/contracts alongside. contracts is
# public, so no token is needed.

name: Deploy to GitHub Pages

on:
  push:
    branches: [release]
  workflow_dispatch:

# Least privilege: no permissions by default; each job grants only what
# it needs (zizmor flags workflow-level pages/id-token write as broad).
permissions: {}

# Allow one concurrent deployment; never cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out docs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: docs
          persist-credentials: false
      - name: Check out sibling contracts
        uses: catenahq/contracts/.github/actions/checkout-sibling@b1a900783044f4453a2c7af1289501da0c086590 # main
        with:
          repository: catenahq/contracts
          path: contracts
          lock: docs/.github/catenahq.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - name: Install
        working-directory: ./docs
        run: npm ci
      - name: Build
        working-directory: ./docs
        env:
          PUBLIC_UMAMI_SCRIPT_URL: ${{ vars.UMAMI_SCRIPT_URL }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
