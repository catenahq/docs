name: baseline-drift

# Guards the committed scanctl baseline (.scanctl/baseline.sarif) against rot.
# security.yml suppresses the baselined findings so per-PR code scanning stays
# clean; this job re-scans WITHOUT the baseline and fails if the live findings
# no longer match what the baseline claims -- either a stale entry (a suppressed
# finding disappeared) or a new finding the baseline does not cover. Runs
# weekly (upstream rule packs and CVE feeds shift on their own) and on demand.
# NOT on pull_request: rot is time-driven, and a full-gate scan on every
# lockfile-touching PR re-blocked unrelated updates on freshly published CVEs
# -- exactly what security.yml's merge-base diff gate exists to prevent. The
# weekly red is the signal to refresh the baseline or bump the offending dep.

on:
  schedule:
    - cron: '37 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0 # full history so gitleaks scans past commits (parity with security.yml)
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install uv
        # uv backs the Python scanners (semgrep, guarddog), lazy-fetched at scan time.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install scanctl
        env:
          # Straight from git, not proxy.golang.org: the proxy caches branch
          # resolution (~30 min), so @main could install a stale scanctl.
          GOPRIVATE: github.com/catenahq/*
        run: go install github.com/catenahq/scanctl/cmd/scanctl@main
      - name: Scan (no baseline)
        env:
          # zizmor's API-backed audits use this when present; absent = --offline.
          GH_TOKEN: ${{ github.token }}
        run: |
          "$(go env GOPATH)/bin/scanctl" run --profile full \
            --out current.sarif --sbom sbom.cdx.json \
            --summary "$GITHUB_STEP_SUMMARY" .
      - name: Check baseline drift
        run: python3 .scanctl/drift-check.py .scanctl/baseline.sarif current.sarif
