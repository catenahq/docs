# Language detection for the bare / root. Every locale is prefixed
# (/en/, /fr/); / itself carries no content. Pick the locale from the
# `lang` cookie (a remembered manual choice) first, else the browser's
# Accept-Language, defaulting to English. This file is included in the
# http context (COPY -> conf.d/default.conf), so map blocks are valid.
map $http_accept_language $lang_by_header {
    default en;
    ~*^fr    fr;
}
map $cookie_lang $lang_pref {
    default $lang_by_header;
    en      en;
    fr      fr;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect the bare root to the detected locale. Exact-match wins
    # over the prefix `location /`, so only / redirects. 302 (not 301)
    # because the target varies per visitor; no-store keeps CF/browser
    # from caching one visitor's language for another.
    location = / {
        add_header Vary "Accept-Language, Cookie" always;
        add_header Cache-Control "no-store" always;
        return 302 /$lang_pref/;
    }

    # Security headers must be repeated inside every `location` block:
    # nginx's `add_header` does NOT inherit from outer scopes once a
    # location adds its own header. Factor into a snippet and `include`
    # it if more locations land.
    #
    # CF Tunnel terminates TLS, so HSTS belongs at the CF edge
    # (Dashboard -> SSL/TLS -> Edge Certificates -> HSTS). Don't add
    # `Strict-Transport-Security` here -- it would only ever take effect
    # if a client somehow hit the origin directly, which the tunnel
    # prevents by construction.

    # Long cache for content-hashed assets (Astro emits hashed JS/CSS
    # under /_astro/). Everything else stays short-cache.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "interest-cohort=()" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Pagefind search index emitted by Starlight.
    location /pagefind/ {
        expires 7d;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "interest-cohort=()" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "interest-cohort=()" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
}
