services:
  web:
    image: example/web:1.2.3
    networks:
      - catena-network
      - default
    labels:
      - "vps.route.host=my-app.yourdomain.com"
      - "vps.route.main=true"
      - "vps.auth.mode=public"
      - "vps.health.path=/health"
      - "vps.display-name=My app"

  admin:
    image: example/admin:1.2.3
    networks:
      - catena-network
      - default
    labels:
      - "vps.route.host=my-app-admin.yourdomain.com"
      - "vps.route.port=8080"
      - "vps.auth.groups=staff"

networks:
  catena-network:
    external: true
